const KEY = "gj-mobile";

const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayKey = () => fmtDate(new Date());

let cur = null, idx = 0;
const app = document.getElementById("app");

function home() {
  cur = null;
  const dow = new Date().getDay();
  let html = `<div class="screen"><h1>Get Jacked</h1><div class="sub">Pick today’s session. Weights are starting suggestions — end each set with 2–3 reps left, add 5 lb when you hit the top of the range on all sets.</div>`;
  for (const k in W) {
    const w = W[k];
    const today = w.days.includes(dow);
    html += `<button class="daybtn${today?" today":""}" onclick="start('${k}')"><span class="t">${w.name}</span>${today?'<span class="pill">TODAY</span>':""}<div class="d">${w.ex.length-1} exercises + warm-up · ~40 min</div></button>`;
  }
  html += `<div class="sub" style="margin-top:16px;">Wed: walk + PT exercises · Sat: hike · Sun: rest + meal prep. Knee rule: pain-free range only — your PT’s guidance wins.</div>`;
  html += `<h1 style="font-size:16pt;margin-top:26px;">This Week’s Food</h1><div class="sub">~2,300 cal · 150–165 g protein daily (estimates — Friday weigh-ins are the referee). Tap a day, check off meals as you eat.</div><div class="chips">`;
  const order = [1,2,3,4,5,6,0];
  const names = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  order.forEach(d => { html += `<button class="chip${d===dow?" today":""}" onclick="mealsView(${d})">${names[d]}</button>`; });
  html += `</div>`;
  const gDone = READINGS.filter((_, i) => S["g|" + i]).length;
  const tk = todayKey();
  const nextIdx = READINGS.findIndex((r, i) => !S["g|" + i]);
  const nextTxt = nextIdx === -1 ? "All 89 chapters read — finished." : `Next: ${READINGS[nextIdx].b} ${READINGS[nextIdx].c} (${fmtDate(READINGS[nextIdx].dt)})`;
  html += `<h1 style="font-size:16pt;margin-top:26px;">The Gospels</h1><div class="sub">Douay-Rheims · all 89 chapters, one whole chapter per reading day, July 27 – December 25. ${gDone}/89 read. ${nextTxt}</div>
    <button class="daybtn" onclick="gospelsView()"><span class="t">Open the reading plan</span><div class="d">Matthew → Mark → Luke → John · tap a chapter to read it, tap the box when done</div></button>`;
  const ei = erinIdx();

  html += `<h1 style="font-size:16pt;margin-top:26px;">For Erin</h1><div class="sub">One a day, July 27 – December 25. Today’s:</div>

    <button class="daybtn" onclick="erinView()"><span class="t">See all 152 days</span><div class="d">Jokes, questions, memories, poems, tiny missions — mixed daily</div></button></div>`;
  app.innerHTML = html;
}

function erinIdx() {
  const start = new Date(2026, 6, 27);
  const now = new Date(); now.setHours(12,0,0,0);
  return Math.min(ERIN.length - 1, Math.max(0, Math.round((now - start) / 86400000)));
}

function erinDate(i) {
  const d = new Date(2026, 6, 27); d.setDate(d.getDate() + i); return d;
}

function erinView() {
  cur = null;
  const ti = erinIdx();
  let html = `<div class="screen"><div class="topbar"><button onclick="home()">‹ Back</button><div style="font-size:11pt;color:#999;">${ERIN.filter((_,i)=>S["e|"+i]).length}/152</div></div>
    <h1>For Erin</h1><div class="sub">One a day through December 25. Tap the box once it’s sent, asked, or done.</div>`;
  let lastMonth = -1;
  ERIN.forEach((e, i) => {
    const d = erinDate(i);
    if (d.getMonth() !== lastMonth) { lastMonth = d.getMonth(); html += `<h1 style="font-size:14pt;margin-top:20px;">${MONTHNAMES[lastMonth]}</h1>`; }
    html += `<div class="mrow${S["e|"+i]?" checked":""}"${i===ti?' style="border:2px solid #6b5a2e;"':""}>
      <span class="mbox" onclick="toggleE(${i},false)">${S["e|"+i]?"✓":""}</span>
      <span><span style="color:#8a7340;font-size:10.5pt;">${d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})} · ${ETYPE[e[0]]}</span>${i===ti?'<span class="pill">TODAY</span>':""}<br>${e[1]}</span></div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
  const t = document.querySelector('.mrow[style*="border"]');
  if (t) t.scrollIntoView({block:"center"});
}

function toggleE(i, fromHome) {
  const k = "e|" + i;
  S[k] = !S[k]; if (!S[k]) delete S[k]; save();
  fromHome ? home() : erinView();
}

    const isToday = dk === tk;
    html += `<div class="mrow${S[k]?" checked":""}"${isToday?' style="border:2px solid #6b5a2e;"':""}>
      <span class="mbox" onclick="toggleG(${i})">${S[k]?"✓":""}</span>
      <span><b>${r.b} ${r.c}</b>${isToday?'<span class="pill">TODAY</span>':""}<br><span style="color:#777;font-size:10.5pt;">${r.dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</span> · <a href="${r.url}" target="_blank" rel="noopener" style="color:#305880;">Read chapter →</a></span></div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
  const t = document.querySelector('.mrow[style*="border"]');
  if (t) t.scrollIntoView({block:"center"});
}

function toggleG(i) {
  const k = "g|" + i;
  S[k] = !S[k]; if (!S[k]) delete S[k]; save();
  gospelsView();
}

function dateOfWeekday(d) {
  const now = new Date(), x = new Date(now);
  x.setDate(now.getDate() + (d - now.getDay()));
  return fmtDate(x);
}

function mealsView(d) {
  cur = null;
  const m = MEALS[d], dk = dateOfWeekday(d);
  let html = `<div class="screen"><div class="topbar"><button onclick="home()">‹ Back</button><div style="font-size:11pt;color:#999;">${dk}</div></div>
    <h1>${m.day}</h1><div class="sub">${m.tag} · ~2,300 cal · 150–165 g protein</div><div style="margin-top:10px;">`;
  m.items.forEach((it, i) => {
    const k = `${dk}|m|${i}`;
    html += `<div class="mrow${S[k]?" checked":""}" onclick="toggleMeal('${k}')">
      <span class="mbox">${S[k]?"✓":""}</span>
      <span><b>${it.n}</b> — ${it.s} <span style="color:#8a7340;font-size:10.5pt;">${it.p}</span></span></div>`;
  });
  html += `</div><div class="sub" style="margin-top:14px;">One treat serving a day — protein first. No cottage cheese, ever. Espressos before 2 p.m.</div></div>`;
  app.innerHTML = html;
}

function toggleMeal(k) {
  S[k] = !S[k]; if (!S[k]) delete S[k]; save();
  mealsView(new Date(k.slice(0,10) + "T12:00:00").getDay());
}

function start(k) { cur = k; idx = 0; render(); }

function render() {
  const w = W[cur], n = w.ex.length;
  if (idx >= n) return doneScreen();
  const ex = w.ex[idx];
  const dk = todayKey();
  const setKey = i => `${dk}|${cur}|${idx}|${i}`;
  const wtKey = `wt|${cur}|${idx}`;
  let dots = w.ex.map((e,i) => {
    const allDone = Array.from({length:e.sets}, (_,j)=>S[`${dk}|${cur}|${i}|${j}`]).every(Boolean);
    return `<span class="dot${i===idx?" on":allDone?" done":""}"></span>`;
  }).join("");
  let setBtns = Array.from({length: ex.sets}, (_,i) =>
    `<button class="setb${S[setKey(i)]?" done":""}" onclick="tapSet(${i})">${ex.sets===1?"✓":"Set "+(i+1)}</button>`).join("");
  app.innerHTML = `<div class="screen">
    <div class="topbar"><button onclick="home()">‹ Exit</button><div class="dots">${dots}</div><div style="width:44px;font-size:10.5pt;color:#999;text-align:right;">${idx+1}/${n}</div></div>
    <div class="card" id="card">
      <div class="exname">${ex.n}</div>
      <div class="scheme">${ex.s}${ex.w?` · ${ex.w}`:""}</div>
      <div class="cue">${ex.cue}</div>
      ${ex.v?`<a class="vid" href="${ex.v}" target="_blank" rel="noopener">▶ Form video (${ex.vc})</a>`:""}
      <div class="sets">${setBtns}</div>
      ${ex.wt?`<div class="wtrow"><input inputmode="decimal" placeholder="lb used" value="${S[wtKey]||""}" onchange="S['${wtKey}']=this.value;save();"></div>`:""}
    </div>
    <div class="nav"><button onclick="prev()">‹ Back</button><button class="next" onclick="next()">Next ›</button></div>
    <div class="hint">swipe left / right to move between exercises</div>
  </div>`;
  attachSwipe();
}

function doneScreen() {
  app.innerHTML = `<div class="screen"><div class="card donecard">
    <div class="exname">Workout complete.</div>
    <div class="cue">That’s one more brick in the December 25 wall. Shake + creatine now, protein at every meal today.</div>
    </div><div class="nav"><button class="next" onclick="home()">Done</button></div></div>`;
  attachSwipe();
}

function tapSet(i) {
  const w = W[cur], ex = w.ex[idx];
  const k = `${todayKey()}|${cur}|${idx}|${i}`;
  S[k] = !S[k]; save();
  render();
  if (S[k]) {
    const lastSet = Array.from({length: ex.sets}, (_,j)=>S[`${todayKey()}|${cur}|${idx}|${j}`]).every(Boolean);
    if (lastSet && ex.sets > 0 && idx < w.ex.length) {
      if (idx === w.ex.length - 1) { idx++; render(); return; }
      showTimer(90, () => { idx++; render(); });
    } else if (ex.sets > 1) {
      showTimer(90);
    }
  }
}

function next() { const n = W[cur].ex.length; if (idx <= n - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } else home(); }

/* swipe */
let sx = null, sy = null;
function attachSwipe() {
  const el = app.firstElementChild;
  el.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  el.addEventListener("touchend", e => {
    if (sx === null || cur === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? next() : prev(); }
    sx = sy = null;
  }, {passive:true});
}

/* timer */
let tLeft = 0, tInt = null, tCb = null;
function showTimer(sec, cb) {
  tLeft = sec; tCb = cb || null;
  document.getElementById("timer").classList.add("show");
  tick();
  clearInterval(tInt);
  tInt = setInterval(() => { tLeft--; if (tLeft <= 0) { beep(); hideTimer(); } else { tick(); } }, 1000);
}
function tick() {
  const m = Math.floor(tLeft/60), s = tLeft%60;
  document.getElementById("tdigits").textContent = `${m}:${String(s).padStart(2,"0")}`;
}
function addTime(s) { tLeft += s; tick(); }
function hideTimer() {
  clearInterval(tInt);
  document.getElementById("timer").classList.remove("show");
  if (tCb) { const f = tCb; tCb = null; f(); }
}
function beep() {
  if (navigator.vibrate) navigator.vibrate([200,100,200]);
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.3;
    o.start(); o.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

home();
</script>
</body>
</html>
